<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        body{
            background-color: #E0E0E0;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            padding: 50px;
        }

        h1{
            color: #424242;
            font-size: 40px;
        }

        h2{
            color: #616161;
        }

        p{
            font-size: 18px;
            color: #555555;
        }

        .box{
            background-color: #F5F5F5;
            padding: 30px;
            margin: 30px auto;
            max-width: 500px;
            border-radius: 10px;
        }

        input, textarea{
            width: 80%;
            padding: 8px;
            margin: 8px;
            border: 1px solid #BDBDBD;
            border-radius: 5px;
            background-color: white;
        }

        textarea{
            height: 100px;
        }

        button{
            background-color: #757575;
            color: #263239;
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background-color: #424242;
        }

        a{
            background-color: #757575;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
        }

        a:hover{
            background-color: #424242;
        }


         @media(max-width:378px) {
             body{
            background-color: #E0E0E0;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            padding: 32px;
        }

        h1{
            color: #424242;
            font-size: 30px;
        }

        h2{
            color: #616161;
        }

        p{
            font-size: 18px;
            color: #555555;
        }

        .box{
            background-color: F5F5F5;
            padding: 30px;
            margin: 30px auto;
            max-width: 500px;
            border-radius: 10px;
        }

        input, textarea{
            width: 80%;
            padding: 8px;
            margin: 8px;
            border: 1px solid #BDBDBD;
            border-radius: 5px;
            background-color: white;
        }

        textarea{
            height: 100px;
        }

        button{
            background-color: #757575;
            color: #263239;
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background-color: #424242;
        }

        a{
            background-color: #757575;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
        }

        a:hover{
            background-color: #424242;
        }
         }
    </style>
</head>
<body>
    <h1>Contact Us</h1>
    <div class="box">
        <h2>Get in Touch</h2>
        <p>Email: institute@gmail.com</p>
        <p>Phone: +91 70831 2****</p>
        <p>Address: Mumbai, Maharashtra</p>
        <hr>
        <h2>Send Us a message</h2>
        <form>
            <input type="text" placeholder="Enter your name">
            &nbsp;&nbsp;
            <input type="email" placeholder="Enter your email">
            <textarea  placeholder="Enter your message"></textarea>
            <br><br>
            <button type="submit">Send Message</button>
        </form>
    </div>
    <br>
    <a href="index.html">Go to Home Page</a>
</body>
</html>
